name: Build LaoYa Duck V4 APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v4-from-zip.yml'
      - '*V4*.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack and locate V4 Android source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(find . -maxdepth 1 -type f -name '*V4*.zip' -print0)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one V4 ZIP; found ${#archives[@]}" >&2
            exit 1
          fi
          mkdir -p .v4-extracted
          unzip -q "${archives[0]}" -d .v4-extracted
          mapfile -d '' build_scripts < <(find .v4-extracted -type f -path '*/scripts/build_original_patch.sh' -print0)
          if [ "${#build_scripts[@]}" -ne 1 ]; then
            echo "ERROR: Expected one V4 build script; found ${#build_scripts[@]}" >&2
            find .v4-extracted -maxdepth 5 -type f | head -60
            exit 1
          fi
          project_dir="$(dirname "$(dirname "${build_scripts[0]}")")"
          if [ ! -s "$project_dir/original/base.apk" ]; then
            echo "ERROR: Original APK missing in $project_dir" >&2
            exit 1
          fi
          mv "$project_dir" LaoyaDuckV4
          test -s LaoyaDuckV4/original/base.apk
          echo "V4 project found: LaoyaDuckV4"
          ls -lh LaoyaDuckV4/original/base.apk
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run source tests
        working-directory: LaoyaDuckV4
        run: |
          python3 scripts/verify_source.py
          node docs/test_parser.js
          node docs/test_original_bridge.js
      - name: Build and sign APK
        working-directory: LaoyaDuckV4
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build_original_patch.sh
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: LaoYaDuckV4-APK
          path: LaoyaDuckV4/rebuilt/老鸭版-快手抓鸭子V4.apk
          if-no-files-found: error
          retention-days: 10
